<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider Clock</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="clock">
        <div class="numbers">
            <span class="n12">12</span>
            <span class="n1">1</span>
            <span class="n2">2</span>
            <span class="n3">3</span>
            <span class="n4">4</span>
            <span class="n5">5</span>
            <span class="n6">6</span>
            <span class="n7">7</span>
            <span class="n8">8</span>
            <span class="n9">9</span>
            <span class="n10">10</span>
            <span class="n11">11</span>
        </div>

        <div class="spider">
            <div class="body"></div>

            <div class="leg leg1"></div>
            <div class="leg leg2"></div>
            <div class="leg leg3"></div>
            <div class="leg leg4"></div>
            <div class="leg leg5"></div>
            <div class="leg leg6"></div>
            <div class="leg leg7"></div>
            <div class="leg leg8"></div>
        </div>

        <div class="center"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
