<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spider Clock</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="spider-clock-container">

        <h1>Spider Clock</h1>

        <div class="clock">

            <!-- Toile d'araignée -->
            <div class="web web-1"></div>
            <div class="web web-2"></div>
            <div class="web web-3"></div>

            <!-- Chiffres -->
            <div class="number n12">12</div>
            <div class="number n1">1</div>
            <div class="number n2">2</div>
            <div class="number n3">3</div>
            <div class="number n4">4</div>
            <div class="number n5">5</div>
            <div class="number n6">6</div>
            <div class="number n7">7</div>
            <div class="number n8">8</div>
            <div class="number n9">9</div>
            <div class="number n10">10</div>
            <div class="number n11">11</div>

            <!-- Araignée -->
            <div class="spider">

                <div class="spider-leg leg-1"></div>
                <div class="spider-leg leg-2"></div>
                <div class="spider-leg leg-3"></div>
                <div class="spider-leg leg-4"></div>

                <div class="spider-leg leg-5"></div>
                <div class="spider-leg leg-6"></div>
                <div class="spider-leg leg-7"></div>
                <div class="spider-leg leg-8"></div>

                <div class="spider-body"></div>

                <div class="spider-head"></div>

            </div>

            <!-- Centre -->
            <div class="clock-center"></div>

        </div>

        <p class="instruction">
            L'heure actuelle est affichée par les pattes de l'araignée
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
