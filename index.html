<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spider-Man Clock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="particles"></div>
<main>
 <h1>Spider Clock</h1>
 <div class="stage"><div class="tilt" id="tilt">
 <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
   <symbol id="spider" viewBox="-60 -60 120 120" overflow="visible">
    <g stroke="#e62429" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
     <g id="legs">
      <polyline points="3,-9 16,-28 26,-30 34,-46"/>
      <polyline points="4,-4 24,-14 38,-12 50,-24"/>
      <polyline points="4,3 26,8 40,16 48,34"/>
      <polyline points="3,9 18,22 26,38 30,52"/>
     </g>
     <use href="#legs" transform="scale(-1,1)"/>
    </g>
    <ellipse cx="0" cy="8" rx="7.5" ry="15" fill="#e62429"/>
    <circle cx="0" cy="-11" r="5" fill="#e62429"/>
   </symbol>
   <radialGradient id="face" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#2a0a14"/><stop offset="1" stop-color="#0b0716"/>
   </radialGradient>
   <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff4a4f"/><stop offset=".5" stop-color="#8d0f16"/><stop offset="1" stop-color="#ff4a4f"/>
   </linearGradient>
   <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="200" cy="200" r="196" fill="url(#face)" stroke="url(#rim)" stroke-width="6"/>
  <circle class="ring" cx="200" cy="200" r="188" fill="none" stroke="#e62429" stroke-width="1" opacity=".7"/>
  <g id="web" stroke="rgba(255,255,255,.22)" fill="none" stroke-width="1"></g>
  <g id="ticks"></g>
  <g id="nums" fill="#fff" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)"></g>
  <g id="ripples"></g>
  <g filter="url(#glow)" stroke-linecap="round">
   <line id="hh" x1="200" y1="215" x2="200" y2="120" stroke="#e62429" stroke-width="6"/>
   <line id="mh" x1="200" y1="218" x2="200" y2="65" stroke="#f5f5f5" stroke-width="3.5"/>
   <g id="sh"><line x1="200" y1="230" x2="200" y2="60" stroke="#5aa9ff" stroke-width="1.4"/>
    <use href="#spider" x="182" y="22" width="36" height="36"/></g>
  </g>
  <g class="emblem"><circle cx="200" cy="200" r="34" fill="#0b0716" stroke="#e62429" stroke-width="2"/>
   <use href="#spider" x="160" y="160" width="80" height="80" filter="url(#glow)"/></g>
 </svg></div></div>
 <div class="digital" id="digital">00:00:00</div>
 <div class="date" id="date"></div>
</main>
<script src="script.js"></script>
</body>
</html>
